// Internal API of scene_sync: everything that needs a ROS 2 service call to
// Isaac (Fast DDS, same vendor as Isaac). Used by robot_service only.
// Objects are given by their id (obj_<k>); scene_sync maps ids to Isaac prims.
syntax = "proto3";

package robot.simlink.v1;

import "google/protobuf/empty.proto";
import "robot_service/robot_service.proto";

message SpawnRequest {
  string catalog = 1;
  reserved 2;
  robot.v1.Pose pose = 3;
}

message SpawnResponse {
  string id = 1;  // the new object's id
}

message IdRequest {
  string id = 1;
}

message ResetResponse {
  uint32 epoch = 1;  // the epoch after the reset
}

message SetAttachedRequest {
  string id = 1;      // an object id, or calib_board
  bool attached = 2;  // attached objects are not pose-updated from /tf
}

message TruePoseRequest {
  string frame = 1;  // an object id, panda_hand, Camera_Pseudo_Depth or calib_board
}

message ClockResponse {
  double sim_time = 1;  // latest /clock
}

service SimLink {
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
  rpc Delete(IdRequest) returns (google.protobuf.Empty);
  // Resets Isaac, deletes the ground-truth objects from both worlds and draws new ids; the sync thread
  // re-creates the objects from the next /tf.
  rpc Reset(google.protobuf.Empty) returns (ResetResponse);
  rpc AttachBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc DetachBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc SetAttached(SetAttachedRequest) returns (google.protobuf.Empty);
  rpc GetTruePose(TruePoseRequest) returns (robot.v1.Pose);
  rpc GetClock(google.protobuf.Empty) returns (ClockResponse);
  // Every mapped object (calib_board excluded).
  rpc ListTrue(google.protobuf.Empty) returns (robot.v1.TrueObjects);
}
