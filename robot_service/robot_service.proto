// The robot API. Every RPC is implemented only with Intrinsic APIs (design
// goal G4). The MCP server generates one tool per RPC of RobotService from
// this file: RPC comments become tool descriptions, request messages the
// input schemas. Units: metres, radians, seconds, newtons, kilograms.
syntax = "proto3";

package robot.v1;

import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";

// Position (m) and orientation (unit quaternion) of a frame.
message Pose {
  double x = 1;
  double y = 2;
  double z = 3;
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

// Seven arm joint positions (rad), joint 1 first.
message Joints {
  repeated double positions = 1;
}

message Wrench {
  double fx = 1;
  double fy = 2;
  double fz = 3;
  double tx = 4;
  double ty = 5;
  double tz = 6;
}

enum Motion {
  MOTION_UNSPECIFIED = 0;  // treated as ANY
  ANY = 1;                 // any collision-free path
  LINEAR = 2;              // straight line of the tool in Cartesian space
}

enum ToolFrame {
  TOOL_FRAME_UNSPECIFIED = 0;  // treated as TCP
  TCP = 1;                     // between the fingertips (frame `tcp`)
  FLANGE = 2;                  // robot flange (frame `flange`)
}

// Long-running calls: with wait = true the call blocks up to 60 s and
// returns the Operation (done or still running); with wait = false it
// returns at once. Poll with RobotService.GetOperation or WaitOperation.
// Operation.metadata is OperationInfo; Operation.response is the RPC's
// documented result message.
message OperationInfo {
  string kind = 1;              // e.g. "MoveToPose"
  double planned_duration_s = 2;
  string state = 3;             // PLANNING, EXECUTING, DONE, FAILED, CANCELLED
  string detail = 4;            // last progress or error message
}

message MoveToPoseRequest {
  Pose pose = 1;               // target pose of `tool`, in the robot base frame
  Motion motion = 2;
  ToolFrame tool = 3;
  bool wait = 4;
}

message MoveJointsRequest {
  Joints joints = 1;
  bool wait = 2;
}

message HomeRequest {
  bool wait = 1;
}

message Waypoint {
  oneof target {
    Pose pose = 1;
    Joints joints = 2;
  }
  Motion motion = 3;
  // Blending radius at this waypoint (m); 0 = stop exactly.
  double blend_radius = 4;
}

message MoveWaypointsRequest {
  repeated Waypoint waypoints = 1;
  ToolFrame tool = 2;
  bool wait = 3;
}

// Result of every motion call (Operation.response).
message MotionResult {
  Joints final_joints = 1;
  double duration_s = 2;
}

message PlanOnlyRequest {
  repeated Waypoint waypoints = 1;
  ToolFrame tool = 2;
}

message PlanOnlyResponse {
  double duration_s = 1;  // at the current speed factor
  Joints final_joints = 2;
  // Approximate axis-aligned bounds of the swept volume in the base frame
  // (only x, y, z are used): the TCP and every arm link origin on every
  // 10th trajectory point, enlarged by 0.08 m for the link radius.
  Pose swept_min = 3;
  Pose swept_max = 4;
}

message ComputeIkRequest {
  Pose pose = 1;
  ToolFrame tool = 2;
  Joints seed = 3;  // optional; current joints when empty
}

message ComputeIkResponse {
  Joints joints = 1;
}

message ComputeFkRequest {
  Joints joints = 1;
  ToolFrame tool = 2;
}

message ComputeFkResponse {
  Pose pose = 1;
}

message CheckCollisionsRequest {
  oneof target {
    Joints joints = 1;
    Pose pose = 2;
  }
  ToolFrame tool = 3;
}

message CheckCollisionsResponse {
  bool in_collision = 1;
  // The planner's description of the collision (one entry, free text naming
  // the colliding objects); empty when not in collision.
  repeated string colliding_pairs = 2;
}

// While the robot is faulted, joints, tool_pose, wrench and the gripper
// fields are unset (ICON reports no state); faulted and fault_reason say why.
message GetStateResponse {
  Joints joints = 1;
  Pose tool_pose = 2;           // TCP in the base frame
  Wrench wrench = 3;            // at the F/T sensor, tared if TareWrench ran
  double gripper_width = 4;     // m
  bool gripping = 5;
  bool enabled = 6;
  bool faulted = 7;
  string fault_reason = 8;
  double speed_factor = 9;
}

message MoveToContactRequest {
  // Unit direction in the base frame.
  double dx = 1;
  double dy = 2;
  double dz = 3;
  double max_force = 4;  // N
  // m/s. Valid range depends on max_force: about 0.00015·max_force to
  // 0.002·max_force (e.g. 0.0021–0.0303 m/s for 15 N).
  double speed = 5;
  bool wait = 6;
}

message MoveCompliantRequest {
  Pose pose = 1;          // TCP target
  double stiffness = 2;   // N/m
  double max_force = 3;   // N
  bool wait = 4;
}

message PlanGraspRequest {
  string object_id = 1;  // an id from `list_objects`
}

message PlanGraspResponse {
  Pose grasp = 1;      // TCP pose
  Pose pregrasp = 2;   // TCP pose
  Joints grasp_joints = 3;
  Joints pregrasp_joints = 4;  // collision-checked in the robot's world model; Pick moves to these
}

message PickRequest {
  string object_id = 1;  // an id from `list_objects`
  bool wait = 2;
}

// Operation.response of Pick.
message PickResult {
  string object_id = 1;
  Pose grasp = 2;        // the TCP pose it grasped at
  double width = 3;      // gripper width after closing (m)
  double duration_s = 4; // sim time of the whole pick
}

message PlaceRequest {
  string object_id = 1;  // the held object (picked or attached)
  // Where to put it, an id from `list_objects`: a box (put inside, on a free spot) or any object or plate
  // (put on its top).
  string target_id = 2;
  bool wait = 3;
}

// Operation.response of Place.
message PlaceResult {
  string object_id = 1;
  string target_id = 2;
  Pose place = 3;        // the TCP pose it released at
  Pose object_pose = 4;  // the object's pose after release (world model)
  double duration_s = 5; // sim time of the whole place
}

message SetSpeedRequest {
  double factor = 1;  // (0, 1]
}

message JogRequest {
  int32 joint = 1;     // 1..7
  double velocity = 2; // rad/s, signed
  double duration_s = 3;
}

message GripperRequest {
  bool wait = 1;
}

// Operation.response of Grasp and Release.
message GripperResult {
  double width = 1;
  bool gripping = 2;
}

message IsGrippingResponse {
  bool gripping = 1;
  double width = 2;
}

message ObjectRequest {
  string id = 1;  // an id from `list_objects`
}

message SetPayloadRequest {
  double mass = 1;  // kg; 0 clears the payload
  double com_x = 2; // centre of mass in the flange frame (m)
  double com_y = 3;
  double com_z = 4;
}

// `pose` is the bottom centre of the object; its bounding box (`size_*`, m) extends upward from it in the
// object's frame.
message WorldObject {
  string id = 1;      // e.g. "obj_42"; changes after a scene reset
  string source = 2;  // "ground_truth" or "perceived"
  Pose pose = 3;      // in the base frame
  string attached_to = 4;  // "" or the parent frame
  string category = 5;  // e.g. "cube", "plate"
  string color = 6;     // a colour word, e.g. "red"
  double size_x = 7;    // m, along the object's x axis
  double size_y = 8;    // m, along the object's y axis
  double size_z = 9;    // m, upward from `pose`
}

message ListObjectsResponse {
  repeated WorldObject objects = 1;
}

enum ImageKind {
  IMAGE_KIND_UNSPECIFIED = 0;  // treated as RGB
  RGB = 1;
  DEPTH = 2;
}

message GetImageRequest {
  ImageKind kind = 1;
}

message GetImageResponse {
  ImageKind kind = 1;
  int32 width = 2;
  int32 height = 3;
  bytes png = 4;            // RGB: 8-bit PNG; DEPTH: 16-bit PNG in mm
  double sim_time = 5;
}

message GetPointCloudRequest {
  // Keep every stride-th pixel (row-major order); 0 means 4, which gives at
  // most 230 400 points (< 2.8 MB).
  int32 stride = 1;
}

message GetPointCloudResponse {
  // Points in the camera frame `d455_optical` (m), x0 y0 z0 x1 ...
  repeated float xyz = 1;
  Pose camera_pose = 2;  // d455 `sensor` (optical frame) in the base frame: the nominal seed until calibrated
  // true once CalibrateCamera succeeded (world's d455 user_data "calibrated")
  bool camera_calibrated = 3;
}

message CalibrateCameraRequest {
  bool wait = 1;
}

message CalibrationResult {
  Pose camera_pose = 1;  // solved d455 `sensor` (optical frame) in the base frame
  reserved 2;
  reserved "reprojection_error_px";
  // RMS translation residual of the camera-to-robot solve (m)
  double rms_translation_m = 4;
  // RMS rotation residual of the camera-to-robot solve (deg)
  double rms_rotation_deg = 5;
  int32 poses_used = 3;  // captures with the board detected (CAPTURE_DATA_STATUS_NO_ERRORS)
}

message DetectObjectsRequest {
  reserved 1;
  repeated string categories = 3;  // categories to look for (e.g. "cube"); empty = all
  bool wait = 2;
}

message Detection {
  string object_id = 1;  // the id in `list_objects`
  Pose pose = 2;
  double score = 3;
  string category = 4;
}

message DetectionResult {
  repeated Detection detections = 1;
}

service RobotService {
  // Robot state: joints, tool pose, wrench, gripper, faults, speed.
  rpc GetState(google.protobuf.Empty) returns (GetStateResponse);
  // Move the tool to a pose (collision-free; LINEAR for a straight line).
  rpc MoveToPose(MoveToPoseRequest) returns (google.longrunning.Operation);
  // Move to joint positions.
  rpc MoveJoints(MoveJointsRequest) returns (google.longrunning.Operation);
  // Move to the home configuration.
  rpc Home(HomeRequest) returns (google.longrunning.Operation);
  // Move through several waypoints with optional blending.
  rpc MoveWaypoints(MoveWaypointsRequest) returns (google.longrunning.Operation);
  // Plan without moving: duration and swept volume.
  rpc PlanOnly(PlanOnlyRequest) returns (PlanOnlyResponse);
  // Inverse kinematics for a tool pose.
  rpc ComputeIk(ComputeIkRequest) returns (ComputeIkResponse);
  // Forward kinematics: tool pose for joint positions.
  rpc ComputeFk(ComputeFkRequest) returns (ComputeFkResponse);
  // Check a configuration or pose for collisions.
  rpc CheckCollisions(CheckCollisionsRequest) returns (CheckCollisionsResponse);
  // Wrench at the wrist sensor.
  rpc GetWrench(google.protobuf.Empty) returns (Wrench);
  // Zero the wrist sensor (removes the current static load).
  rpc TareWrench(google.protobuf.Empty) returns (google.protobuf.Empty);
  // Tares, moves along the direction at about `speed`, stops when the contact force reaches `max_force`.
  rpc MoveToContact(MoveToContactRequest) returns (google.longrunning.Operation);
  // Moves toward the TCP pose as a spring of `stiffness`, using the current tare; ends at the target, at
  // `max_force`, or when it stops moving (jam).
  rpc MoveCompliant(MoveCompliantRequest) returns (google.longrunning.Operation);
  // Plan a grasp for an object in the world, given by an id from `list_objects`.
  rpc PlanGrasp(PlanGraspRequest) returns (PlanGraspResponse);
  // Pick an object: plan a grasp, move to the pre-grasp and grasp poses, close the gripper, attach the object
  // in the world model and lift it. One planned attempt, no retries; on failure the operation's error says
  // why (no grasp found, object too wide, grasp blocked, gripper closed on nothing, a fault).
  rpc Pick(PickRequest) returns (google.longrunning.Operation);
  // Place the held object in a box (a free, collision-free spot inside) or on top of another object or plate:
  // move above the spot, lower, open the gripper, detach and retreat. One planned attempt, no retries; on
  // failure the error says why (target full, no reachable spot, not holding the object, a fault).
  rpc Place(PlaceRequest) returns (google.longrunning.Operation);
  // Stop the current motion (not a fault).
  rpc Stop(google.protobuf.Empty) returns (google.protobuf.Empty);
  // Scale the speed of following motions.
  rpc SetSpeed(SetSpeedRequest) returns (google.protobuf.Empty);
  // Clear robot faults.
  rpc ClearFaults(google.protobuf.Empty) returns (google.protobuf.Empty);
  // Jog one joint at a velocity for a duration.
  rpc Jog(JogRequest) returns (google.protobuf.Empty);
  // Close the gripper until it stops (on an object or fully closed).
  rpc Grasp(GripperRequest) returns (google.longrunning.Operation);
  // Open the gripper.
  rpc Release(GripperRequest) returns (google.longrunning.Operation);
  // Whether the gripper holds something.
  rpc IsGripping(google.protobuf.Empty) returns (IsGrippingResponse);
  // Treat an object (an id from `list_objects`) as held by the gripper (planning).
  rpc AttachObject(ObjectRequest) returns (google.protobuf.Empty);
  // Release an attached object (an id from `list_objects`) back into the scene (planning).
  rpc DetachObject(ObjectRequest) returns (google.protobuf.Empty);
  // Set the mass of what the robot carries.
  rpc SetPayload(SetPayloadRequest) returns (google.protobuf.Empty);
  // Objects in the robot's world model. Objects are identified only by `id`; match the user's words to
  // `category`, `color`, `size` and `pose`; ids change after a scene reset.
  rpc ListObjects(google.protobuf.Empty) returns (ListObjectsResponse);
  // Take a camera image.
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  // Take a point cloud from the depth camera: every stride-th pixel (default
  // 4, at most 230 400 points, < 2.8 MB).
  rpc GetPointCloud(GetPointCloudRequest) returns (GetPointCloudResponse);
  // Calibrate the camera against the robot (board must be attached).
  rpc CalibrateCamera(CalibrateCameraRequest) returns (google.longrunning.Operation);
  // Detect objects and update the world model.
  rpc DetectObjects(DetectObjectsRequest) returns (google.longrunning.Operation);
  // State of a long-running call (from its Operation.name): done, error
  // (code and message) or result; metadata is OperationInfo.
  rpc GetOperation(google.longrunning.GetOperationRequest) returns (google.longrunning.Operation);
  // Wait until a long-running call is done or the timeout (default and at
  // most 60 s) passes; returns its Operation either way.
  rpc WaitOperation(google.longrunning.WaitOperationRequest) returns (google.longrunning.Operation);
}

// Simulation-only operations for developers and tests; not exposed to the
// VLM.
message AddObjectRequest {
  string catalog = 1;
  reserved 2;
  Pose pose = 3;  // bottom centre, in the world frame
}

message AddObjectResponse {
  string id = 1;  // the new object's id
}

message GetTruePoseRequest {
  string frame = 1;  // an object id, "panda_hand" or "Camera_Pseudo_Depth"
}

// Isaac's objects with their ids (tests only).
message TrueObject {
  string id = 1;
  string catalog = 2;
  string prim = 3;  // Isaac prim name (= /tf frame)
  Pose pose = 4;    // latest /tf pose; unset until the prim is on /tf
}

message TrueObjects {
  repeated TrueObject objects = 1;
}

service SimService {
  rpc AddObject(AddObjectRequest) returns (AddObjectResponse);
  // An object id.
  rpc RemoveObject(ObjectRequest) returns (google.protobuf.Empty);
  // Resets Isaac's scene; returns once the objects are back in the world model with new ids.
  rpc ResetScene(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc GetTruePose(GetTruePoseRequest) returns (Pose);
  // Every Isaac object with its id, catalog and prim (tests only).
  rpc ListTrueObjects(google.protobuf.Empty) returns (TrueObjects);
  rpc AttachCalibrationBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc DetachCalibrationBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
}
